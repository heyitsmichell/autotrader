[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -n auto --tb=short
markers =
    slow: takes more than ~3 s (deselect with -m "not slow")
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning