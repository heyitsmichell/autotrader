[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Fast loop:  python -m pytest -n 2 -m "not slow"
# Full suite:  python -m pytest -n 2
# Serial by default (memory). For parallel runs pass `-n 2` explicitly, not `-n auto`.
addopts = --tb=short
markers =
    slow: takes more than ~3 s (deselect with -m "not slow")
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning